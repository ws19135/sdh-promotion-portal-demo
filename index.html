<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base target="_top" />
<title>Promotion ERP Portal 示範版（虛構資料・唯讀）</title>
<meta name="robots" content="noindex,nofollow" />
<style>
:root{
  color-scheme: light;
  --bg:#f7f7f5; --panel:#ffffff; --ink:#26241f; --muted:#7a776d;
  --line:#e7e4dc; --accent:#a4553a; --accent-soft:#f1e3dc;
  --ok:#3f6b4f; --ok-soft:#e7f0e9; --warn:#8a5a17; --warn-soft:#fbeedb;
  --err:#a13f3f; --err-soft:#f6e5e3; --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;}
.p4-shell{max-width:1040px;margin:0 auto;padding:0 20px 60px;}
.p4-topbar{display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10;}
.p4-topbar .title{font-weight:600;font-size:15px;}
.p4-env-badge{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);
  color:var(--warn);border:1px solid #edd9ad;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;margin-left:10px;}
.p4-account{font-size:12px;color:var(--muted);}
.p4-release-label{display:inline-flex;align-items:center;background:var(--accent-soft);
  color:var(--accent);border:1px solid #e6cfc2;border-radius:999px;padding:4px 12px;
  font-size:11px;font-weight:600;margin-left:10px;font-family:ui-monospace,monospace;}
.p4-scopebar{background:var(--panel);border-bottom:1px solid var(--line);
  padding:8px 20px;font-size:12px;color:var(--muted);line-height:1.6;}
.p4-scopebar strong{color:var(--ink);font-weight:600;}
.p4-nav{display:flex;gap:6px;padding:12px 0;flex-wrap:wrap;}
.p4-nav button{background:none;border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink);}
.p4-nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.p4-nav button[disabled]{opacity:.5;cursor:not-allowed;}
.p4-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;margin-bottom:16px;}
.p4-card h2{margin:0 0 12px;font-size:16px;}
.p4-field{margin-bottom:12px;}
.p4-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.p4-field input,.p4-field textarea{width:100%;padding:8px 10px;
  border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);
  font-family:inherit;}
.p4-field.invalid input,.p4-field.invalid textarea{border-color:var(--err);background:var(--err-soft);}
.p4-field .hint{font-size:11px;color:var(--err);margin-top:4px;}
.p4-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:10px 18px;font-size:14px;cursor:pointer;font-weight:600;}
.p4-btn[disabled]{opacity:.5;cursor:not-allowed;}
.p4-btn.secondary{background:none;border:1px solid var(--line);color:var(--ink);}
.p4-status-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;}
.p4-alert{border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:14px;}
.p4-alert.success{background:var(--ok-soft);color:var(--ok);border:1px solid #cfe3d5;}
.p4-alert.error{background:var(--err-soft);color:var(--err);border:1px solid #edd0cd;}
.p4-alert.info{background:var(--accent-soft);color:var(--accent);border:1px solid #e6cfc2;}
.p4-empty{text-align:center;padding:40px 20px;color:var(--muted);}
.p4-loading{text-align:center;padding:30px;color:var(--muted);font-size:13px;}
.p4-loading::before{content:"◐";display:inline-block;margin-right:8px;animation:p4spin 1s linear infinite;}
@keyframes p4spin{to{transform:rotate(360deg);}}
.p4-list-row{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.p4-list-row:last-child{border-bottom:none;}
.p4-list-row:hover{background:#fafaf8;}
.p4-muted{color:var(--muted);font-size:12px;}
.p4-kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px;margin-bottom:14px;}
.p4-kv dt{color:var(--muted);}
.p4-kv dd{margin:0;}
.p4-detail-ref{font-size:11px;color:var(--muted);margin-top:6px;font-family:ui-monospace,monospace;}

/* ============================================================================
   PROMOTION SCREEN TOKENS + COMPONENTS — CR_P7_MAIN_SYSTEM_VISUAL_INTEGRATION_01
   §16 DESIGN RECONCILIATION (intentional token scoping):
   The Portal frame keeps its OWN terracotta chrome (:root --accent:#a4553a).
   We DO NOT overwrite :root. Instead the promotion screen's olive/action/guard/
   info/violet semantic palette (from the OWNER_ACCEPTED UI_PREVIEW_V1) is scoped
   under #promo-screen so the status colors (neutral/pending/interested/declined/
   expired/confirmed/error) survive intact while the topbar/nav/dashboard/requests
   screens stay terracotta. color-scheme stays light everywhere.
   All component class names below live under #promo-screen so nothing leaks into
   the Portal's .p4-* components.
   ============================================================================ */
#promo-screen{
  --accent:#5E6E40; --accent-soft:#EAEFE0;
  --action:#96591A; --action-soft:#F6E9D8;
  --guard:#9E4A4A; --guard-soft:#F4E2E0;
  --info:#3A6B7E; --info-soft:#E1EDF1;
  --violet:#6C5A86; --violet-soft:#ECE6F2;
  --p-bg:#F6F4EF; --p-surface:#FFFFFF; --p-surface-2:#FBFAF6; --p-line:#E7E2D6;
  --p-ink:#2B2A26; --p-ink-soft:#6B665C; --p-ink-faint:#928C7E;
  --p-radius:12px; --p-radius-sm:8px;
  --p-shadow:0 1px 2px rgba(43,42,38,.06), 0 4px 14px rgba(43,42,38,.05);
  --p-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color:var(--p-ink);
}
#promo-screen .promo-mock-banner{background:linear-gradient(90deg,#3A2E22,#5E4A34);color:#F6ECD8;font-size:12.5px;padding:7px 16px;display:flex;gap:10px;align-items:center;justify-content:center;letter-spacing:.02em;border-radius:var(--p-radius-sm);margin-bottom:12px}
#promo-screen .promo-mock-banner b{color:#FFDFA6}
#promo-screen .promo-wrap{display:grid;grid-template-columns:minmax(320px,380px) 1fr;gap:14px;align-items:start}
@media(max-width:820px){ #promo-screen .promo-wrap{grid-template-columns:1fr} }
#promo-screen .promo-list{background:var(--p-surface-2);border:1px solid var(--p-line);border-radius:var(--p-radius);padding:12px}
#promo-screen .promo-list-head{display:flex;align-items:center;gap:8px;margin:2px 4px 12px}
#promo-screen .promo-list-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--p-ink-faint);margin:0;font-weight:700}
#promo-screen .promo-list-head .count{margin-left:auto;font-size:12px;color:var(--p-ink-faint)}
#promo-screen .case-card{background:var(--p-surface);border:1px solid var(--p-line);border-radius:var(--p-radius);padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .12s,box-shadow .12s;position:relative}
#promo-screen .case-card:hover{border-color:#D8D0BF;box-shadow:var(--p-shadow)}
#promo-screen .case-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#promo-screen .case-card .subj{font-weight:650;font-size:14px;margin:0 0 6px;padding-right:16px}
#promo-screen .case-card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--p-ink-soft);font-size:12px;margin-bottom:9px}
#promo-screen .case-card .meta .k{color:var(--p-ink-faint)}
#promo-screen .stage-row{display:flex;align-items:center;gap:7px;margin-bottom:8px}
#promo-screen .mini-counts{display:flex;flex-wrap:wrap;gap:5px}
#promo-screen .need{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--action);background:var(--action-soft);border-radius:var(--p-radius-sm);padding:6px 9px;margin-top:2px}
#promo-screen .need svg{flex:none;margin-top:1px}
#promo-screen .foreign-pill{position:absolute;top:12px;right:12px}
#promo-screen .promo-detail{background:var(--p-bg);border:1px solid var(--p-line);border-radius:var(--p-radius);padding:18px 20px;min-height:320px}
#promo-screen .detail-empty{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--p-ink-faint);gap:10px;text-align:center}
#promo-screen .d-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
#promo-screen .d-head h2{font-size:20px;margin:0;font-weight:700;line-height:1.3}
#promo-screen .d-sub{color:var(--p-ink-soft);font-size:13px;margin:6px 0 16px;display:flex;flex-wrap:wrap;gap:6px 16px}
#promo-screen .d-sub .k{color:var(--p-ink-faint)}
#promo-screen .foreign-note{background:var(--info-soft);border:1px solid #CFE1E7;color:#2C5361;border-radius:var(--p-radius-sm);padding:10px 13px;font-size:12.5px;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
#promo-screen section.block{background:var(--p-surface);border:1px solid var(--p-line);border-radius:var(--p-radius);padding:16px 18px;margin-bottom:14px}
#promo-screen section.block > h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--p-ink-faint);margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
#promo-screen .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
#promo-screen .kv .k{color:var(--p-ink-faint)}
#promo-screen .brief{background:var(--p-surface-2);border-radius:var(--p-radius-sm);padding:11px 13px;font-size:13px;color:var(--p-ink-soft);white-space:pre-wrap;margin-top:6px}
#promo-screen .rail{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-top:2px}
#promo-screen .rail .step{display:flex;align-items:center;font-size:12px;color:var(--p-ink-faint)}
#promo-screen .rail .bub{width:11px;height:11px;border-radius:50%;background:var(--p-line);margin-right:6px}
#promo-screen .rail .step.done .bub{background:var(--accent)}
#promo-screen .rail .step.done{color:var(--accent);font-weight:600}
#promo-screen .rail .step.cur .bub{background:var(--action);box-shadow:0 0 0 3px var(--action-soft)}
#promo-screen .rail .step.cur{color:var(--action);font-weight:700}
#promo-screen .rail .arrow{width:20px;height:1px;background:var(--p-line);margin:0 8px}
#promo-screen .match{border:1px solid var(--p-line);border-radius:var(--p-radius);margin-bottom:11px;overflow:hidden}
#promo-screen .match.selected{border-color:var(--accent)}
#promo-screen .match-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--p-surface-2);cursor:pointer}
#promo-screen .match-top .kol{font-weight:650;font-size:14px}
#promo-screen .match-top .kol .email{color:var(--p-ink-faint);font-weight:400;font-size:12px;margin-left:8px}
#promo-screen .match-top .chev{margin-left:auto;color:var(--p-ink-faint);transition:transform .15s}
#promo-screen .match.open .chev{transform:rotate(90deg)}
#promo-screen .match-body{padding:14px;border-top:1px solid var(--p-line);display:none}
#promo-screen .match.open .match-body{display:block}
#promo-screen .dims{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#promo-screen .dim{border:1px solid var(--p-line);border-radius:var(--p-radius-sm);padding:8px 11px;min-width:132px;background:var(--p-surface-2)}
#promo-screen .dim .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--p-ink-faint);margin-bottom:5px}
#promo-screen .quote-facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px 14px;font-size:13px;margin-top:4px}
#promo-screen .quote-facts .k{color:var(--p-ink-faint);font-size:11.5px}
#promo-screen .fin{border-top:1px dashed var(--p-line);margin-top:10px;padding-top:9px}
#promo-screen .fin .tag-fin{font-size:10.5px;color:var(--action);letter-spacing:.05em}
#promo-screen .actions{margin-top:12px;padding-top:12px;border-top:1px solid var(--p-line)}
#promo-screen .actions .ttl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--p-ink-faint);margin-bottom:9px;display:flex;align-items:center;gap:7px}
#promo-screen .act-row{display:flex;flex-wrap:wrap;gap:8px}
#promo-screen .pbtn{border:1px solid var(--p-line);background:var(--p-surface);color:var(--p-ink);border-radius:var(--p-radius-sm);padding:8px 13px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s;font-weight:550}
#promo-screen .pbtn:hover{border-color:#CBC3B2;background:var(--p-surface-2)}
#promo-screen .pbtn:disabled{opacity:.5;cursor:not-allowed}
#promo-screen .pbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#promo-screen .pbtn.primary:hover{background:#4e5c35}
#promo-screen .pbtn.guard{color:var(--guard);border-color:#E6C9C6}
#promo-screen .pbtn.guard:hover{background:var(--guard-soft)}
#promo-screen .pbtn.nonmut{border-style:dashed;color:var(--info)}
#promo-screen .pbtn .mut-dot{width:6px;height:6px;border-radius:50%;background:var(--action)}
#promo-screen .pbtn.nonmut .mut-dot{background:transparent;border:1px solid var(--info)}
#promo-screen .no-actions{font-size:12.5px;color:var(--p-ink-faint);font-style:italic}
#promo-screen .action-legend{font-size:11.5px;color:var(--p-ink-faint);margin-top:9px;display:flex;gap:14px;flex-wrap:wrap}
#promo-screen .action-legend span{display:inline-flex;align-items:center;gap:5px}
#promo-screen .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
#promo-screen .badge .d{width:6px;height:6px;border-radius:50%}
#promo-screen .b-neutral{background:#EEEBE3;color:#6B665C}
#promo-screen .b-accent{background:var(--accent-soft);color:#3f4c2a}
#promo-screen .b-action{background:var(--action-soft);color:#7a4713}
#promo-screen .b-info{background:var(--info-soft);color:#2C5361}
#promo-screen .b-violet{background:var(--violet-soft);color:#4f4066}
#promo-screen .b-green{background:#DBEBD6;color:#345c2c}
#promo-screen .b-guard{background:var(--guard-soft);color:#7c3a3a}
#promo-screen .b-strike{background:#EEEBE3;color:#928C7E;text-decoration:line-through}
#promo-screen .b-expired{background:#EFE3D2;color:#8a5a1e;border-color:#E3CDA8}
#promo-screen .confirm-box{background:#DBEBD6;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#345c2c;margin-top:4px}
#promo-screen .spinner{width:22px;height:22px;border:2.5px solid var(--p-line);border-top-color:var(--accent);border-radius:50%;animation:p4spin .7s linear infinite;display:inline-block;vertical-align:middle}
#promo-screen .loading-pane{min-height:240px;display:flex;align-items:center;justify-content:center;gap:11px;color:var(--p-ink-faint)}
#promo-screen .errbox{background:var(--guard-soft);border:1px solid #E6C9C6;color:#7c3a3a;border-radius:var(--p-radius);padding:16px 18px;display:flex;gap:11px;align-items:flex-start}
#promo-screen .errbox .code{font-family:var(--p-mono);font-size:11.5px;color:#9E4A4A;opacity:.8}
/* overlay + toast live at document root (fixed); scoped by their own ids */
#promo-overlay-host .overlay{position:fixed;inset:0;background:rgba(43,42,38,.34);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#promo-overlay-host .dialog{background:#fff;border-radius:12px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.22);color:#2B2A26;font-size:14px}
#promo-overlay-host .dialog h4{margin:0 0 8px;font-size:16px}
#promo-overlay-host .dialog p{margin:0 0 16px;color:#6B665C;font-size:13px}
#promo-overlay-host .dialog .row{display:flex;gap:9px;justify-content:flex-end}
#promo-overlay-host .field{margin-bottom:12px}
#promo-overlay-host .field label{display:block;font-size:12px;color:#928C7E;margin-bottom:4px}
#promo-overlay-host .field input{width:100%;border:1px solid #E7E2D6;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
#promo-overlay-host .copybox{background:#FBFAF6;border:1px solid #E7E2D6;border-radius:8px;padding:11px;font-size:12.5px;white-space:pre-wrap;max-height:220px;overflow:auto;color:#6B665C}
#promo-overlay-host .dialog{max-height:90vh;overflow:auto}
#promo-overlay-host .field select,#promo-overlay-host .field textarea{width:100%;border:1px solid #E7E2D6;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff}
#promo-overlay-host .field textarea{min-height:70px;resize:vertical}
#promo-overlay-host .pbtn{border:1px solid #E7E2D6;background:#fff;color:#2B2A26;border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;font-weight:550}
#promo-overlay-host .pbtn.primary{background:#5E6E40;border-color:#5E6E40;color:#fff}
#promo-overlay-host .pbtn.guard{background:#9E4A4A;border-color:#9E4A4A;color:#fff}
#promo-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#2B2A26;color:#F6ECD8;padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;transition:all .25s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;align-items:center;gap:9px}
#promo-toast.show{opacity:1;transform:translateX(-50%) translateY(0);display:flex}
#promo-toast .rt{font-family:ui-monospace,monospace;font-size:11px;color:#C9BCA0}
/* CR_P9 · guided simulation — scoped under #promo-screen, reuses the promo tokens */
#promo-screen .uat-guided{max-width:940px;margin:0 auto}
#promo-screen .uat-banner{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;background:var(--action-soft);color:var(--action);border:1px solid var(--action);border-radius:var(--p-radius);padding:10px 16px;margin-bottom:16px;font-size:13.5px}
#promo-screen .uat-banner b{font-weight:750}
#promo-screen .uat-banner-sub{color:var(--p-ink-soft);font-size:12.5px}
#promo-screen .uat-progress{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
#promo-screen .uat-prog-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--p-ink-faint);background:var(--p-surface-2);border:1px solid var(--p-line);border-radius:999px;padding:5px 11px 5px 6px}
#promo-screen .uat-prog-item .dot{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--p-line);color:var(--p-surface);font-size:11px;font-weight:700}
#promo-screen .uat-prog-item.current{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
#promo-screen .uat-prog-item.current .dot{background:var(--accent)}
#promo-screen .uat-prog-item.done{color:var(--accent)}
#promo-screen .uat-prog-item.done .dot{background:var(--accent)}
#promo-screen .uat-wrap{display:grid;grid-template-columns:minmax(280px,340px) 1fr;gap:14px;align-items:start}
@media(max-width:820px){ #promo-screen .uat-wrap{grid-template-columns:1fr} }
#promo-screen .uat-scenario .uat-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--action);background:var(--action-soft);border-radius:var(--p-radius-sm);padding:3px 9px;margin-bottom:8px}
#promo-screen .uat-scenario h3{margin:0 0 12px;font-size:15px}
#promo-screen .uat-kv{display:flex;gap:10px;margin-bottom:8px;font-size:13px;line-height:1.5}
#promo-screen .uat-kv .k{color:var(--p-ink-faint);flex:0 0 56px}
#promo-screen .uat-state{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid var(--p-line)}
#promo-screen .uat-chip{font-size:12px;font-weight:650;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 11px}
#promo-screen .uat-chip.alt{color:var(--info);background:var(--info-soft)}
#promo-screen .uat-step-head{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--p-ink-faint);text-transform:uppercase;margin-bottom:4px}
#promo-screen .uat-step h2{margin:0 0 14px;font-size:19px}
#promo-screen .uat-instruct,#promo-screen .uat-expect{font-size:14px;line-height:1.6;margin:0 0 10px}

function T(key, vars){

// ============================================================================
// BOOT STATE MACHINE — 7 states per P4_HTMLSERVICE_BOOT_STATE_MATRIX.md
// ============================================================================
var BOOT_STATE = 'BOOTING';   // initial (static HTML already reflects this)
var BOOT_TIMER = null;
var BOOTSTRAP_RESULT = null;   // stored after CHECKING_IDENTITY resolves
var PORTAL_MODE = 'OPERATOR';  // CR_P8 · 'OPERATOR' | 'UAT_READER' (server-derived)
var $envBadge = document.getElementById('p4-env-badge');
var $account  = document.getElementById('p4-account');
var $view     = document.getElementById('p4-view');
var $nav      = document.getElementById('p4-nav');

function setBootState(state){
  BOOT_STATE = state;
}
// CR_P21 · the environment marker in plain words (PRODUCTION -> 正式環境; sandbox -> 測試環境｜測試資料). Never an internal environment id.
function envLabelFor(r){
  if (r && r.environment === 'PRODUCTION') return T('env.label.production');
  if (r && r.is_sandbox) return T('env.label.sandbox');
  return T('env.label.unknown');
}

function renderBootLoading(msgKey){
  $view.innerHTML = '<div class="p4-card"><div class="p4-loading">' + esc(T(msgKey)) + '</div></div>';
}
function renderBootTerminal(titleKey, bodyKey, detailRef){
  var body = '<div class="p4-card"><h2>' + esc(T(titleKey)) + '</h2>' +
             '<p>' + esc(T(bodyKey)) + '</p>';
  if (detailRef){
    body += '<p class="p4-detail-ref">' + esc(detailRef) + '</p>';
  }
  body += '<button class="p4-btn" id="p4-reload-btn">' + esc(T('common.retry')) + '</button></div>';
  $view.innerHTML = body;
  document.getElementById('p4-reload-btn').onclick = function(){ window.location.reload(); };
}
function startBootTimer(){
  if (BOOT_TIMER) clearTimeout(BOOT_TIMER);
  BOOT_TIMER = setTimeout(function(){
    if (BOOT_STATE === 'CHECKING_IDENTITY' || BOOT_STATE === 'LOADING_ENVIRONMENT'){
      setBootState('TIMEOUT');
      $envBadge.textContent = T('env.badge.timeout');
      renderBootTerminal('boot.timeout.title','boot.timeout.body', null);
    }
  }, 10000);
}
function clearBootTimer(){ if (BOOT_TIMER){ clearTimeout(BOOT_TIMER); BOOT_TIMER = null; } }

function boot(){
  setBootState('CHECKING_IDENTITY');
  $envBadge.textContent = T('env.badge.checking');
  renderBootLoading('boot.checking_identity');
  startBootTimer();
  google.script.run
    .withSuccessHandler(onBootstrapSuccess)
    .withFailureHandler(onBootstrapFailure)
    .p4OwnerPortalBootstrap();
}
function onBootstrapSuccess(result){
  if (!result){ onBootstrapFailure({message:'empty response'}); return; }
  BOOTSTRAP_RESULT = result;
  if (result.ok === false && result.state === 'ACCESS_DENIED'){
    clearBootTimer();
    setBootState('ACCESS_DENIED');
    $envBadge.style.display = 'none';   // CR_P21: a refused account has no environment to show
    if (result.caller_email){ $account.textContent = T('env.account_prefix') + result.caller_email; }
    renderBootTerminal('boot.access_denied.title','boot.access_denied.body', null);
    return;
  }
  if (!result.ok){
    onBootstrapFailure({message: (result.error && result.error.code) || 'bootstrap failed'});
    return;
  }
  // allowlisted → LOADING_ENVIRONMENT
  PORTAL_MODE = (result.mode === 'UAT_READER') ? 'UAT_READER' : 'OPERATOR';
  setBootState('LOADING_ENVIRONMENT');
  $envBadge.textContent = T('env.badge.template', {env: envLabelFor(result)});
  $account.textContent  = T('env.account_prefix') + (result.caller_email || '—');
  applyUatBanner();
  renderBootLoading('boot.loading_environment');
  // CR_P8 · READY precondition depends on mode. An operator gates on
  // owner.dashboard.summary (ANY_INTERNAL). A UAT reader CANNOT call that route
  // (read-only, not an internal role), so its precondition is owner.project.list
  // — a route the isolated uat-ro channel is allowed to call — and it lands on
  // the 合作推廣 screen instead of the operator dashboard.
  if (PORTAL_MODE === 'UAT_READER'){
    google.script.run
      .withSuccessHandler(onUatReady)
      .withFailureHandler(onBootstrapFailure)
      .p4OwnerPortalInvoke({ route: 'owner.project.list', payload: {} });
    return;
  }
  google.script.run
    .withSuccessHandler(onDashboardReady)
    .withFailureHandler(onBootstrapFailure)
    .p4OwnerPortalInvoke({ route: 'owner.dashboard.summary', payload: {} });
}
function onDashboardReady(env){
  clearBootTimer();
  if (!env || env.ok !== true){
    if (env && p21ErrKind(env) === 'denied'){                       // CR_P21: a signed-in account the system does not know as a colleague: say so, instead of 「初始化失敗」
      setBootState('INITIALIZATION_FAILED'); $envBadge.style.display = 'none'; renderBootTerminal('boot.access_denied.title','boot.access_denied.body', null);
      return;
    }
    onBootstrapFailure({message: env && env.error && env.error.code || 'dashboard failed', env: env});
    return;
  }
  setBootState('READY');
  renderNav();
  navigate('dashboard', { dashboard: env.data });
}
// CR_P9 · UAT reader READY: identity confirmed; enter the GUIDED SIMULATION.
// The list precondition proved the isolated uat-ro channel works; the guided
// experience itself is client-side synthetic simulation (zero backend writes).
function onUatReady(env){
  clearBootTimer();
  if (!env || env.ok !== true){
    onBootstrapFailure({message: env && env.error && env.error.code || 'uat list failed', env: env});
    return;
  }
  setBootState('READY');
  renderNav();
  navigate('uat-guided', {});
}
// CR_P9 · the tester banner: this is a SIMULATION over synthetic data, not merely
// read-only — the tester will click simulated transitions, so say so plainly.
function applyUatBanner(){
  if (PORTAL_MODE === 'UAT_READER'){
    try { $envBadge.textContent = T('env.badge.uat_sim'); } catch(e){}
  }
}
function onBootstrapFailure(err){
  clearBootTimer();
  if (BOOT_STATE === 'READY') return;  // ignore late failures if we already made it
  setBootState('INITIALIZATION_FAILED');
  $envBadge.textContent = T('env.badge.failed');
  renderBootTerminal('boot.init_failed.title','boot.init_failed.body', null);
}

// NAV + SCREEN ROUTER

var NAV = [
  { id:'dashboard', label:'nav.dashboard' },
  { id:'requests',  label:'nav.requests'  },
  { id:'promotion', label:'nav.promotion' }   // CR_P7 · promotion case screen
];
var STATE = { view:'dashboard', params:{}, cachedDashboard:null };

function renderNav(){
  // CR_P9 · a UAT tester runs a SELF-CONTAINED guided simulation with its own
  // progress rail — no operator nav (總覽/需求/合作推廣) is shown, so there is
  // nothing to wander into and no operator route to call. Server stays
  // authoritative regardless.
  if (PORTAL_MODE === 'UAT_READER'){ $nav.style.display = 'none'; $nav.innerHTML = ''; return; }
  $nav.style.display = '';
  $nav.innerHTML = '';
  var items = NAV;
  items.forEach(function(n){
    var b = document.createElement('button');
    b.textContent = T(n.label);
    if (STATE.view === n.id || (n.id === 'requests' && STATE.view === 'request-detail')){ b.className = 'active'; }
    b.onclick = function(){ navigate(n.id, {}); };
    $nav.appendChild(b);
  });
}
function navigate(view, params){
  STATE.view = view;
  STATE.params = params || {};
  renderNav();
  render();
}
window.p4Navigate = navigate;

// Small helper: disable a button for the round-trip of one action.
function busy(btn, fn){
  return function(){
    if (btn.disabled) return;
    btn.disabled = true;
    fn().then(function(){ btn.disabled = false; }, function(){ btn.disabled = false; });
  };
}
/*__PROMO_TEST_EXTRACT_START:BASE_TRANSPORT__*/
// Wrap google.script.run in a Promise so we can use .then()/.catch() flows.
function invoke(request){
  return new Promise(function(resolve){
    google.script.run
      .withSuccessHandler(function(env){ resolve(env || { ok:false, error:{ code:'E_UNEXPECTED_SERVER_ERROR', user_safe_message_key:'err.alpha.unexpected' } }); })
      .withFailureHandler(function(err){ resolve({ ok:false, error:{ code:'E_UNEXPECTED_SERVER_ERROR', user_safe_message_key:'err.alpha.unexpected' } }); })
      .p4OwnerPortalInvoke(request);
  });
}
// One idempotency key per logical action (reused across retries of the same click).
var IDEM_KEYS = {};
function idemKeyFor(actionId){
  if (!IDEM_KEYS[actionId]){
    IDEM_KEYS[actionId] = 'idem-' + Math.random().toString(16).slice(2) + Date.now().toString(16);
  }
  return IDEM_KEYS[actionId];
}
function resetIdemKey(actionId){ delete IDEM_KEYS[actionId]; }
/*__PROMO_TEST_EXTRACT_END:BASE_TRANSPORT__*/

function render(){
  switch (STATE.view){
    case 'dashboard':       return renderDashboard();
    case 'requests':        return renderRequestList();
    // CR-P5 · REMEDIATION-01 · 'request-create' removed. Requests are created by
    // external requesters through the public intake form (FLOW-01), never by an
    // internal operator. An unknown view falls through to the dashboard.
    case 'request-detail':  return renderRequestDetail(STATE.params);
    case 'promotion':       return renderPromotion();   // CR_P7
    case 'uat-guided':      return renderUatGuided();    // CR_P9 · guided simulation
    default:                return renderDashboard();
  }
}

// ---------------------------------------------------------------- Dashboard
// the sample behind 「進行中」: the item count of the same read-only request list the 需求 screen uses (so nothing is guessed); repaints the cards once known, a failure leaves the number withheld
function p21LoadDashSample(){
  if (STATE.dashSampleBusy) return; STATE.dashSampleBusy = true;
  invoke({ route:'owner.request.list', payload:{} }).then(function(env){
    STATE.dashSampleBusy = false;
    if (env && env.ok && env.data && env.data.items){ STATE.dashSampleLen = env.data.items.length; if (STATE.view === 'dashboard' && STATE.cachedDashboard) paintDashboard(STATE.cachedDashboard); }
  });
}
function renderDashboard(){
  // CR_P21 · the boot read (loading → ready, or a retry/denied screen) hands over the first digest in params.dashboard. Coming back to 總覽 later shows the cached cards AT ONCE and
  // re-reads the (read-only) summary, so the numbers are never stale after the colleague acted elsewhere; a failed refresh keeps the cards on screen.
  var fresh = STATE.params.dashboard || null;
  if (fresh){ STATE.cachedDashboard = fresh; paintDashboard(fresh); p21LoadDashSample(); return; }
  var cached = STATE.cachedDashboard;
  if (cached){ paintDashboard(cached); p21LoadDashSample(); } else { renderBootLoading('boot.loading_environment'); }   // (nothing cached = the boot read has not finished: same loading line as boot)
  invoke({ route:'owner.dashboard.summary', payload:{} }).then(function(env){
    if (STATE.view !== 'dashboard') return;                         // the colleague already moved on: never paint over another screen
    if (env.ok){ STATE.cachedDashboard = env.data; paintDashboard(env.data); }
    else if (!cached){ paintErrorCard(env, function(){ renderDashboard(); }); }
  });
}
function p21ReqBadge(st){ return '<span class="p4-status-badge" title="' + esc(st) + '">' + esc(p21ReqStatusLabel(st)) + '</span>'; }
function p21CountText(n){ return (typeof n === 'number' && isFinite(n)) ? String(n) : '—'; }
function p21Card(num, label, goLabel, goView, id, unk){

    (goLabel ? '<button class="p4-btn secondary" id="' + esc(id) + '" onclick="p4Navigate(\'' + goView + '\')">' + esc(goLabel) + '</button>' : '') + '</div>';
}
function paintDashboard(data){

    : '<p class="p4-muted">' + esc(T('dashboard.audit_healthy')) + '</p>';

// ---------------------------------------------------------------- Request list
// CR_P22 · G-4 · the request list pages (「載入更多需求」) and filters by status (全部 / 待審核 / 審核中), the same states as the project list (P21 G-3).
// Core requests.list honours page, page_size (<= 50) and an EXACT status; Gateway B now forwards exactly those three keys. The Portal sends no page_size (Core default 20, the
// same page the dashboard's 「最近 N 筆」 digest is based on). A read that is no longer the newest one (filter switched, screen left) is dropped, never painted.
var P22_REQ_FILTERS = [['', 'p22.req.f.all'], ['SUBMITTED', 'p22.req.f.submitted'], ['UNDER_REVIEW', 'p22.req.f.under_review']];
var REQ_LIST = { status: '', items: [], total: null, page: 1, hasNext: false, loadingMore: false, moreError: false, refreshed: false, seq: 0 };
function p22ReqPayload(page){ var p = {}; if (REQ_LIST.status) p.status = REQ_LIST.status; if (page > 1) p.page = page; return p; }
function p22ReqFilterLabel(st){ for (var i = 0; i < P22_REQ_FILTERS.length; i++){ if (P22_REQ_FILTERS[i][0] === st) return T(P22_REQ_FILTERS[i][1]); } return T('p22.req.f.all'); }
function p22ReqCountText(){
  var items = REQ_LIST.items, more = p21ListMore(REQ_LIST.total, items.length, REQ_LIST.hasNext);
  if (!items.length) return '';
  if (REQ_LIST.total === null) return T('p22.req.count_loaded', { n: items.length });
  return more !== 0 ? T('p22.req.count_more', { n: items.length, total: REQ_LIST.total }) : T('p22.req.count', { total: REQ_LIST.total });
}
// the WHOLE card is rebuilt on every paint (title, 登錄新需求, filter, count, body): one source of truth, no stale fragment
function p22ReqPaintCard(bodyHtml){
  $view.innerHTML = '<div class="p4-card"><h2>' + esc(T('request.list.title')) + '</h2>' + p16RequestNewButtonHtml() +
    '<div class="p22-req-head"><div class="p22-chips" id="p22-req-filter" role="group" aria-label="' + esc(T('p22.req.filter_label')) + '">' +
    P22_REQ_FILTERS.map(function(f){ var on = REQ_LIST.status === f[0]; return '<button type="button" class="p22-chip' + (on ? ' on' : '') + '" data-st="' + esc(f[0]) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + esc(T(f[1])) + '</button>'; }).join('') +
    '</div><span class="p22-req-count" id="p22-req-count">' + esc(p22ReqCountText()) + '</span></div>' +
    '<div id="p22-req-body">' + bodyHtml + '</div>' +
    '<div style="margin-top:14px"><p class="p4-muted">' + esc(T('request.intake_note')) + '</p></div></div>';
  p16BindRequestNew();   // CR_P16A
  Array.prototype.forEach.call(document.querySelectorAll('#p22-req-filter button'), function(b){ b.onclick = function(){ REQ_LIST.status = b.getAttribute('data-st') || ''; renderRequestList(); }; });
  var lm = document.getElementById('p22-req-load-more'); if (lm) lm.onclick = p22ReqLoadMore;
  var rb = document.getElementById('p21-retry-btn'); if (rb) rb.onclick = function(){ renderRequestList(); };
}
function renderRequestList(why){
  REQ_LIST.items = []; REQ_LIST.total = null; REQ_LIST.page = 1; REQ_LIST.hasNext = false; REQ_LIST.loadingMore = false; REQ_LIST.moreError = false;
  REQ_LIST.refreshed = (why === 'p22-list-changed');   // only the load-more shrink check below passes this; the router / chips / retry start clean
  var seq = ++REQ_LIST.seq;
  p22ReqPaintCard('<div class="p4-loading" id="p21-req-loading">' + esc(T('p21.req.loading')) + '</div><div class="p21-skel" style="width:80%"></div><div class="p21-skel" style="width:60%"></div>');
  invoke({ route:'owner.request.list', payload: p22ReqPayload(1) }).then(function(env){
    if (seq !== REQ_LIST.seq || !document.getElementById('p22-req-body')) return;     // a newer read owns the screen, or the screen was left: drop this answer
    if (!env || !env.ok || !env.data){
      p22ReqPaintCard(alertBox('error', p21LoadErrText(env)) + (p21ErrCode(env) ? '<div class="p4-detail-ref">代碼：' + esc(p21ErrCode(env)) + '</div>' : '') + detailRefLine(env) +
        (p21RetryUseful(env) ? '<button class="p4-btn" id="p21-retry-btn">' + esc(T('p21.retry')) + '</button>' : ''));
      return;
    }
    REQ_LIST.items = (env.data.items || []).slice(); REQ_LIST.total = (typeof env.data.total === 'number') ? env.data.total : null;
    REQ_LIST.page = Number(env.data.page) || 1; REQ_LIST.hasNext = env.data.has_next === true;

  });
}
function p22PaintReqList(){
  if (!document.getElementById('p22-req-body')) return;
  var items = REQ_LIST.items, more = p21ListMore(REQ_LIST.total, items.length, REQ_LIST.hasNext);
  if (!items.length){
    p22ReqPaintCard(REQ_LIST.status
      ? '<div class="p21-friendly" id="p21-req-empty"><div class="p21-title">' + esc(T('p22.req.empty_filtered_title', { label: p22ReqFilterLabel(REQ_LIST.status) })) + '</div>' + esc(T('p22.req.empty_filtered_body')) + '</div>'
      : '<div class="p21-friendly" id="p21-req-empty"><div class="p21-title">' + esc(T('p21.req.empty_title')) + '</div>' + esc(T('p21.req.empty_body')) + '</div>');   // (an emptied list after a refresh needs no extra line: the empty state says it)
    return;
  }
  var note = REQ_LIST.refreshed ? '<p class="p4-muted" id="p22-req-refreshed" style="margin:0 0 8px">' + esc(T('p22.req.refreshed')) + '</p>' : '';
  var rows = note + items.map(function(r){
    return '<div class="p4-list-row" onclick="p4Navigate(\'request-detail\',{id:\''+ esc(r.request_id) +'\'})">' +
           '<span>' + esc(r.title) + '</span>' + p21ReqBadge(r.status) + '</div>';
  }).join('');
  var moreHtml = '';
  if (more !== 0){
    moreHtml = '<div class="p21-more" id="p21-req-more">' + esc(REQ_LIST.moreError ? T('p22.req.more_error') : (more ? T('p22.req.more_hint', { m: more }) : T('p22.req.more_hint_generic'))) +
      '<div><button class="p4-btn secondary" id="p22-req-load-more"' + (REQ_LIST.loadingMore ? ' disabled' : '') + '>' + esc(REQ_LIST.loadingMore ? T('p22.req.loading_more') : (REQ_LIST.moreError ? T('p21.retry') : T('p22.req.load_more'))) + '</button></div></div>';

function p22ReqLoadMore(){
  if (REQ_LIST.loadingMore) return;

  var seq = REQ_LIST.seq, next = REQ_LIST.page + 1;
  invoke({ route:'owner.request.list', payload: p22ReqPayload(next) }).then(function(env){
    if (seq !== REQ_LIST.seq || !document.getElementById('p22-req-body')) return;
    REQ_LIST.loadingMore = false;
    if (!env || !env.ok || !env.data){ REQ_LIST.moreError = true; p22PaintReqList(); return; }
    var seen = {}; REQ_LIST.items.forEach(function(r){ seen[r.request_id] = true; });
    var fresh = (env.data.items || []).filter(function(r){ if (seen[r.request_id]) return false; seen[r.request_id] = true; return true; });

    // would silently skip one request. A total that shrank, or more rows than the total, means the pages no longer line up: read again from page 1 (same chip) and say so.

function promotionInvoke(route, payload){

    return new Promise(function(resolve){

  var a = promoAliasFor(route);

  if(route === 'projects.list'){ return { ok:true, data: PROMO_FIXTURE['projects.list'] }; }

    var pid = payload && payload.project_id;

// 進行中的需求 on the dashboard. The Core counts open requests ONLY inside the newest page of the request list, so the count is a statement about "the latest N requests", not about all of them.
// Provable cases: every request is open (total <= open) or the sample IS everything (total <= sample length) -> exact. total > sample -> say "among the latest N" and how many older ones are not counted.
// Nothing provable (sample size or total unknown) -> no number at all. No server field is invented: sample length = the item count of the same owner.request.list read the Requests screen already uses.
function p21OpenCard(openN, total, sampleLen){

// Every mutation goes through promotionInvoke / invoke (the SAME transport as the rest of the Portal); the server stays the authority for
// role, project ownership and state. Messages are business sentences only: no route name, no error code is ever shown here.
// ============================================================================
function p16Mutate(route, payload, okKey, after){
  promotionInvoke(route, payload).then(function(env){
    if(!env || !env.ok){ promoToast(T(p16ErrKey(env)), '', p21SoftMs(env, 7000), p21IsSoft(env) ? 'warn' : 'err'); return; }
    if(env.data && env.data.reconciliation_required === true){ promoToast(T('p16.recon_warn'), '', 9000, 'warn'); PROMO_STATE.recon = { pid: PROMO_STATE.currentProjectId, text: T('p16.recon_warn') }; }   // review round 1 (L1): the action DID apply, but a journal record needs attention — a warning, never a plain success
    else promoToast(T(okKey));
    resetIdemKey('promo:' + route + ':' + JSON.stringify(payload));   // a finished action releases ITS key (re-adding the same KOL after giving it up must act, not replay)
    if(after) after(env);
  });
}

  'p16-f-promo': 150, 'p16-f-kolreq': 150, 'p16-f-audience': 150, 'p16-f-schedule': 80 };   // CR_P22 · G-6: the four review-screen fields, Core caps (76_P16A P16A_FIELD_CAPS)
var P22_REQ_EXTRA = [['p16-f-promo', 'promo_type_summary'], ['p16-f-kolreq', 'kol_requirements_summary'], ['p16-f-audience', 'target_audience'], ['p16-f-schedule', 'course_schedule_location']];   // = the REQ_FIELDS the reviewer reads

function p16Trim(v){ return String(v == null ? '' : v).replace(/^\s+|\s+$/g, ''); }
function p16Len(v){ return p16Trim(v).length; }                    // UTF-16 units of the trimmed text = what the server counts
function p16Bytes(v){ var j = JSON.stringify(p16Trim(v)), n = 0; for (var i = 1; i < j.length - 1; i++){ var c = j.charCodeAt(i); n += c < 0x80 ? 1 : (c < 0x800 ? 2 : 3); } return n; }   // same rule as the server

var WF_RESET_ROUTES = ['projects.assignOwner', 'projects.markReadyToClose', 'projects.withdrawReadyToClose', 'deliverables.create', 'deliverables.review', 'tasks.complete'];
function wfMutate(route, payload, okKey, kind, repaintPoolOnly){
  promotionInvoke(route, payload).then(function(env){
    if(!env.ok){
      if(typeof wfFinUnsettledDialog === 'function' && wfFinUnsettledDialog(route, payload, env)) return;   // CR_P16B review M1 · closing with undecided finance: business dialog (+ manager waiver)
      var ek = wfErrKey(env, kind);
      // S1: the business sentence stands alone — no internal error code / route name appended (Owner: do NOT expose internal terminology).
      if(ek === 'wf.ready.blocked_exec'){ promoToast(T(ek)); return; }
      if(typeof p21LearnDenied === 'function') p21LearnDenied(env, kind);    // CR_P21: remember a refusal so manager-only controls are hidden next time
      var soft = (typeof p21IsSoft === 'function') && p21IsSoft(env);           // CR_P21: the business sentence ALONE (no code, no route name); a refused double submit / a timed-out call is a gentle warning
      promoToast(ek ? T(ek) : promoErrText(env.error), '', (typeof p21SoftMs === 'function') ? p21SoftMs(env, 7000) : 7000, soft ? 'warn' : 'err'); return;
    }
    if(wfFinanceLockPartial(route, env)){ promoToast(T(wfFinanceLockCopyKey(env)), '', 9000, 'warn'); PROMO_STATE.recon = { pid: PROMO_STATE.currentProjectId, text: T(wfFinanceLockCopyKey(env)) }; } else { promoToast(T(okKey)); }   // CR_P13G: a partial lock is a WARNING: no route suffix, shown for 9 s
    // Same payload twice in a session (assign A → B → A) must NOT replay the first cached success: a finished assignment releases its key.
    // A finished state-changing action releases ITS key (and, for the ready/withdraw pair, the sibling's key): the server caches a success for 24h,
    // so re-using a key after the state moved on would replay the old success instead of acting (mark → withdraw → mark; reject → resubmit).
    if(WF_RESET_ROUTES.indexOf(route) !== -1){ resetIdemKey('promo:' + route + ':' + JSON.stringify(payload)); }
    if(route === 'projects.withdrawReadyToClose' && payload.project_id){ resetIdemKey('promo:projects.markReadyToClose:' + JSON.stringify({ project_id: payload.project_id })); }
    if(route === 'matches.closeKolPart'){ WF_CTX.closedKol[payload.match_id] = true; }
    if(repaintPoolOnly || route.indexOf('candidates.') === 0){ WF_CTX.poolFor = null; }   // pool changed → reload on repaint
    promoOpenDetail(PROMO_STATE.currentProjectId);
    if(route === 'projects.assignOwner' || route === 'projects.close' || route === 'projects.markReadyToClose' || route === 'projects.withdrawReadyToClose'){ if(typeof promoReloadLoadedPages === 'function') promoReloadLoadedPages(); else promoLoadList(); }
  });
}

function wfFinLoad(d){
  var plan = wfPlan(d); if(!wfFinVisible(d, plan)) return;
  var pid = d.project && d.project.project_id; if(!pid) return;
  if(WF_FIN.projectId === pid && WF_FIN.detailRef === d && (WF_FIN.data || WF_FIN.error || WF_FIN.loading)) return;   // already loaded for THIS detail (a mutation clears projectId; a re-fetched detail is a new object)
  WF_FIN.projectId = pid; WF_FIN.detailRef = d; WF_FIN.data = null; WF_FIN.error = ''; WF_FIN.loading = true;
  promotionInvoke('finance.projectView', { project_id: pid }).then(function(env){
    if(WF_FIN.projectId !== pid) return;                                                          // the user moved on to another project
    WF_FIN.loading = false;
    if(env && env.ok){ WF_FIN.data = env.data; WF_FIN.error = ''; }
    else { WF_FIN.data = null; WF_FIN.error = (wfFinErrKey(env) === 'fin.err.denied') ? 'denied' : 'failed'; }
    wfFinRepaint();
  });
}
function wfFinMutate(route, payload, okKey){
  if(WF_FIN.busy) return;                                                                         // one write at a time: a double click can never send two
  WF_FIN.busy = true;
  promotionInvoke(route, payload).then(function(env){
    WF_FIN.busy = false;
    var pid = PROMO_STATE.currentProjectId;
    if(!env || !env.ok){
      promoToast(T(wfFinErrKey(env)), '', p21SoftMs(env, 6000), p21IsSoft(env) ? 'warn' : 'err');       // business sentence only: no code, no route
      WF_FIN.projectId = null; wfFinLoad(PROMO_STATE.detail); wfFinRepaint();                    // show what the server now says (the stale buttons are replaced at once)
      return;
    }
    resetIdemKey('promo:' + route + ':' + JSON.stringify(payload));                              // a finished action releases its key: the same payload later (return → re-estimate) must act again
    promoToast(T(env.data && env.data.reconciliation_required ? 'fin.ok.recon' : (env.data && (env.data.unchanged || env.data.replayed) ? 'fin.ok.unchanged' : okKey)), '', env.data && env.data.reconciliation_required ? 9000 : 3500, env.data && env.data.reconciliation_required ? 'warn' : '');   // a journal record needs attention: shown longer, no internal wording
    if(env.data && env.data.reconciliation_required){ PROMO_STATE.recon = { pid: PROMO_STATE.currentProjectId, text: T('fin.ok.recon') }; }

}

function promoOnAction(mid, actKey){

  var a = (m.allowed_actions||[]).filter(function(x){ return x.action_key===actKey; })[0]; if(!a) return;

  if(actKey==='invitation.create'){ p22ShowInvitationForm(m, a); return; }   // CR_P22 · G-1: write the content first, then create the draft
  if(actKey==='invitation.cancel'){ promoShowReasonForm(m,a); return; }   // CR_P11: collect the required reason
  if(actKey==='candidate.abandon'){ p16AbandonDialog({ match_id: mid }); return; }   // CR_P16A: reason dialog, then candidates.abandon
  if(a.requires_confirm){ promoConfirmDialog(m,a); return; }   // markDispatched keeps its confirm dialog
  promoDispatch(m, a, {});

  markDispatched: function(s){
    if(!this._guard(s,'INVITATION_DRAFT')) return { ok:false, code:'E_UAT_OUT_OF_ORDER' };
    s.invitation='SENT'; s.match='INVITED'; s.done.dispatched=true; s.log.push('invitation.markDispatched(sim)');
    return { ok:true };
  },
  recordInterested: function(s){
    if(!this._guard(s,'INVITED')) return { ok:false, code:'E_UAT_OUT_OF_ORDER' };
    s.invitation='RESPONDED'; s.response='INTERESTED'; s.match='INTERESTED'; s.done.responded=true; s.log.push('response.interested(sim)');
    return { ok:true };
  },
  recordQuote: function(s){
    if(!this._guard(s,'INTERESTED')) return { ok:false, code:'E_UAT_OUT_OF_ORDER' };
    s.match='QUOTED'; s.quote_recorded=true; s.done.quoted=true; s.log.push('quote.create(sim)');
    return { ok:true };
  },
  negotiate: function(s){
    if(!this._guard(s,'QUOTED')) return { ok:false, code:'E_UAT_OUT_OF_ORDER' };
    s.match='NEGOTIATING'; s.done.negotiating=true; s.log.push('match.negotiate(sim)');
    return { ok:true };
  },
  confirm: function(s){
    if(!this._guard(s,'NEGOTIATING')) return { ok:false, code:'E_UAT_OUT_OF_ORDER' };
    s.match='CONFIRMED'; s.done.confirmed=true; s.log.push('match.confirm(sim)');
    return { ok:true };
  }
};

function uatHasAnyFeedback(s){
  if (s.overall && s.overall.trim()) return true;

function uatFeedbackWidget(stepNum, s){

function uatWireFeedback(stepNum, s){
  var toggle=$view.querySelector('[data-uat="fb-toggle"]'), body=$view.querySelector('.uat-fb-body'),
      text=$view.querySelector('[data-uat="fb-text"]'), save=$view.querySelector('[data-uat="fb-save"]'),
      clr=$view.querySelector('[data-uat="fb-clear"]'), saved=$view.querySelector('[data-uat="fb-saved"]');
  if(toggle) toggle.onclick=function(){ if(body){ body.hidden=!body.hidden; if(!body.hidden && text) text.focus(); } };
  if(save) save.onclick=function(){
    var v=text?text.value:''; if(!s.feedback) s.feedback={};
    if(v && v.trim()){ s.feedback[stepNum]=v.trim(); } else { delete s.feedback[stepNum]; }
    uatSave(s); if(saved){ saved.textContent='已記下'; setTimeout(function(){ if(STATE.view==='uat-guided') navigate('uat-guided',{}); },350); }
  };

// Fallback clipboard copy for older webviews.
function uatFallbackCopy(txt){
  try { var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); var okc=document.execCommand('copy'); document.body.removeChild(ta); return !!okc; } catch(e){ return false; }
}
// Client-side Markdown download (no server / Drive write).
function uatDownloadMd(txt){
  try {
    var d=new Date(); function p(n){return (n<10?'0':'')+n;}
    var fname='合作推廣系統_測試回饋_'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+'.md';
    var blob=new Blob([txt],{type:'text/markdown;charset=utf-8'});
    var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(url);},1500);
  } catch(e){}
}
// Restart with a warning when feedback exists (never silently destroy notes).
function uatConfirmRestart(s){
  if (!uatHasAnyFeedback(s)){ uatReset(); navigate('uat-guided',{}); return; }
  var host=document.createElement('div'); host.className='uat-modal';
  host.innerHTML='<div class="uat-modal-card"><h3>要重新開始嗎？</h3><p>重新開始會清除這次測試留下的回饋。確定要重新開始嗎？</p>'+
    '<div class="uat-modal-actions"><button class="uat-btn uat-ghost" data-uat="m-cancel">取消</button><button class="uat-btn uat-guard" data-uat="m-ok">重新開始</button></div></div>';
  // Mount inside #promo-screen so the scoped design tokens resolve (position:fixed
  // still covers the viewport regardless of DOM parent).
  var scope=document.querySelector('#promo-screen')||document.body; scope.appendChild(host);
  host.querySelector('[data-uat="m-cancel"]').onclick=function(){ host.remove(); };
  host.querySelector('[data-uat="m-ok"]').onclick=function(){ host.remove(); uatReset(); navigate('uat-guided',{}); };
}

// State-derived completion: whether a step's required action has ALREADY happened is read from the
// simulation state, never from transient DOM. Re-rendering (saving feedback, reopening) therefore can
// never re-lock 下一步 after the action was done.
function uatActionDone(key, s){
  switch(key){
    case 'approve': return s.request==='APPROVED';
    case 'draft':   return s.match!=='CANDIDATE';
    case 'send':    return !!s.done.dispatched;
    case 'resp':    return s.response==='INTERESTED';
    case 'quote':   return !!s.quote_recorded;
    case 'nego':    return !!s.done.negotiating;
    case 'confirm': return !!s.done.confirmed;
  }
  return true;
}
function uatNext(needsAction, step, s){
  var locked = !!needsAction && !(step && s && uatActionDone(step.key, s));
  return '<div class="uat-nav"><button class="uat-btn uat-primary" data-uat="next"'+(locked?' disabled':'')+'>下一步 →</button>' +
         '<button class="uat-btn uat-ghost" data-uat="restart-inline">重新開始測試</button></div>';
}
function uatAdvance(s){ s.step += 1; uatSave(s); navigate('uat-guided', {}); }
function uatEnable(sel){ var b=$view.querySelector(sel); if(b) b.disabled=false; }
function uatWireStep(step, s){
  var restart = $view.querySelector('[data-uat="restart-inline"]'); if(restart) restart.onclick=function(){ uatReset(); navigate('uat-guided',{}); };
  var next = $view.querySelector('[data-uat="next"]');
  function done(){ if(next) next.disabled=false; }
  if(next) next.onclick=function(){ if(next.disabled) return; uatAdvance(s); };
  function on(id, fn){ var b=$view.querySelector('[data-uat="'+id+'"]'); if(b) b.onclick=fn; }
  // Already-done actions stay disabled after a re-render (no double-fire, no re-lock).
  var ACT = { approve:'approve', draft:'draft', send:'dispatch', resp:'interested', quote:'quote', nego:'nego', confirm:'confirm' };
  if(ACT[step.key] && uatActionDone(step.key, s)){ var ab=$view.querySelector('[data-uat="'+ACT[step.key]+'"]'); if(ab) ab.disabled=true; }
  switch(step.key){
    case 'req': case 'cand': /* read steps: 下一步 already enabled */ break;
    case 'approve': on('approve', function(){ if(UATSimulationAdapter.approveRequest(s).ok){ uatSave(s); done(); reflectState(s); this.disabled=true; } }); break;
    case 'draft': on('draft', function(){ if(UATSimulationAdapter.createInvitationDraft(s).ok){ uatSave(s); done(); reflectState(s); this.disabled=true; } }); break;
    case 'send':
      on('copy', function(){ UATSimulationAdapter.copyInvitation(s); uatSave(s); setHint('uat-send-hint','已複製邀約內容（示範用，狀態沒有改變）。'); });
      on('mailto', function(){ UATSimulationAdapter.openEmail(s); uatSave(s); setHint('uat-send-hint','已開啟 Email 示範（狀態沒有改變）。真正寄出後再按下一顆。'); });
      on('dispatch', function(){ if(UATSimulationAdapter.markDispatched(s).ok){ uatSave(s); done(); reflectState(s); setHint('uat-send-hint','已標記「已寄出」，媒合進到「已邀約」。'); this.disabled=true; } });
      break;
    case 'resp':
      on('interested', function(){ if(UATSimulationAdapter.recordInterested(s).ok){ uatSave(s); done(); reflectState(s); setHint('uat-resp-hint','已記錄「有意願」。'); this.disabled=true; } });
      on('declined', function(){ setHint('uat-resp-hint','這次示範走「有意願」這條線，請改點「記錄：有意願」繼續。'); });
      break;
    case 'quote': on('quote', function(){ if(UATSimulationAdapter.recordQuote(s).ok){ uatSave(s); done(); reflectState(s); this.disabled=true; } }); break;
    case 'nego':  on('nego', function(){ if(UATSimulationAdapter.negotiate(s).ok){ uatSave(s); done(); reflectState(s); this.disabled=true; } }); break;
    case 'confirm': on('confirm', function(){ if(UATSimulationAdapter.confirm(s).ok){ uatSave(s); done(); reflectState(s); this.disabled=true; } }); break;
  }
}
function setHint(id, txt){ var el=document.getElementById(id); if(el) el.textContent=txt; }
function reflectState(s){
  var sc = $view.querySelector('.uat-scenario'); if(sc) sc.innerHTML = uatScenarioHtml(s);
}


// ============================================================================
// KICKOFF — runs after full DOM is ready. Static shell already painted above.
// ============================================================================
// Wire the promotion adapter's transport + idempotency hooks to the Portal's
// REAL invoke()/idemKeyFor() so LIVE reuses the single p4OwnerPortalInvoke path.
promoSetTransport(p21Transport);   // CR_P21: the single in-progress / double-submit guard sits in the transport
promoSetIdem(idemKeyFor);
promoSetT(T);

// Standalone boot: in MOCK mode (or when google.script.run is unavailable, e.g.
// opened as a local file) the promotion screen must run without the server
// bootstrap. LIVE with google present keeps the normal 7-state boot untouched.
function promoStandalone(){
  return PROMO_ADAPTER_MODE === 'MOCK' || typeof google === 'undefined' || !google || !google.script || !google.script.run;
}
function bootOrStandalone(){
  if (promoStandalone()){
    // If the server transport is genuinely unavailable (opened outside the
    // Apps Script host, e.g. local file/http), there is no live path to call —
    // force MOCK so the promotion screen renders from the embedded fixture
    // instead of throwing on an undefined `google`. In real Production
    // HtmlService `google.script.run` exists, so boot() runs and mode stays LIVE.
    var transportUnavailable = (typeof google === 'undefined' || !google || !google.script || !google.script.run);
    if (transportUnavailable && PROMO_ADAPTER_MODE !== 'MOCK') promoSetMode('MOCK');
    setBootState('READY');
    // CR_P9 · standalone GUIDED-SIM preview: `?uatsim=1` renders the colleague
    // guided simulation exactly as a real UAT tester sees it (synthetic data,
    // zero backend). Used for local browser E2E of the guided journey.
    var uatSimPreview = false;
    try { uatSimPreview = /[?&]uatsim=1\b/.test(String(window.location.search || '')); } catch(e){}
    if (uatSimPreview){
      PORTAL_MODE = 'UAT_READER';
      applyUatBanner();
      $account.textContent = T('env.account_prefix') + 'tester@example.test';
      renderNav();
      navigate('uat-guided', {});
      return;
    }
    $envBadge.textContent = (PROMO_ADAPTER_MODE==='MOCK') ? '本機預覽｜假資料' : '本機預覽';
    $account.textContent = T('env.account_prefix') + (PROMO_FIXTURE && PROMO_FIXTURE._meta && PROMO_FIXTURE._meta.operator ? PROMO_FIXTURE._meta.operator.email : '—');
    renderNav();
    navigate('promotion', {});
    return;
  }
  boot();
}
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', bootOrStandalone);
} else {
  bootOrStandalone();
}
})();
</script>
